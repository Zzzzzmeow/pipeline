name: Cangjie CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: self-hosted
    env:
      CANGJIE_HOME: /root/cangjie
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment
        run: |
          export PATH="${CANGJIE_HOME}/bin:${CANGJIE_HOME}/tools/bin:${PATH}"
          cjc --version
          cjpm --version

      - name: Build
        run: |
          export PATH="${CANGJIE_HOME}/bin:${CANGJIE_HOME}/tools/bin:${PATH}"
          cjpm build

      - name: Unit test
        run: |
          export PATH="${CANGJIE_HOME}/bin:${CANGJIE_HOME}/tools/bin:${PATH}"
          cjpm test --verbose
